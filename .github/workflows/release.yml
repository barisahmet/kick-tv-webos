name: Release

# Push a version tag (for example v1.0.0) and this builds the installable .ipk
# and attaches it to a GitHub Release so people can download it.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install the webOS CLI
        run: npm install -g @webos-tools/cli

      # webOS only accepts plain X.Y.Z, and the tag must never reach a script as code.
      - name: Check the tag is a plain version
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Match the app version to the tag
        run: node -e "const fs=require('fs'),p='app/appinfo.json',j=JSON.parse(fs.readFileSync(p));j.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - name: Build the .ipk
        run: ares-package ./app ./services/com.barisahmet.kicktv.service -o .

      - name: Write the webosbrew manifest
        run: |
          export IPK="com.barisahmet.kicktv_${VERSION}_all.ipk"
          export SHA=$(sha256sum "$IPK" | cut -d' ' -f1)
          node -e "const fs=require('fs'),e=process.env;fs.writeFileSync('org.webosbrew.manifest.json', JSON.stringify({id:'com.barisahmet.kicktv',version:e.VERSION,type:'web',title:'Kick TV',appDescription:'Watch Kick livestreams on your LG webOS TV. Unofficial.',iconUri:'https://raw.githubusercontent.com/barisahmet/kick-tv-webos/main/app/largeIcon.png',sourceUrl:'https://github.com/barisahmet/kick-tv-webos',rootRequired:false,ipkUrl:e.IPK,ipkHash:{sha256:e.SHA}}, null, 2));"
          cat org.webosbrew.manifest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" com.barisahmet.kicktv_*.ipk org.webosbrew.manifest.json \
            --title "Kick TV $TAG" \
            --notes "Download the .ipk below and sideload it onto your LG webOS TV in Developer Mode. See the README for the steps."
